<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="55%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="gemTop" x1="32" y1="24" x2="96" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#A5B4FC" />
    </linearGradient>
    <linearGradient id="gemLeft" x1="26" y1="54" x2="64" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="gemCenter" x1="46" y1="54" x2="82" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="gemRight" x1="64" y1="54" x2="102" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bgGrad)" />
  <rect x="4" y="4" width="120" height="120" rx="26" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" />
  <!-- Top facets -->
  <polygon points="42,28 86,28 102,52 26,52" fill="url(#gemTop)" />
  <polygon points="42,28 64,28 50,52 26,52" fill="#FFFFFF" fill-opacity="0.35" />
  <polygon points="64,28 86,28 78,52 50,52" fill="#FFFFFF" fill-opacity="0.18" />
  <!-- Bottom facets -->
  <polygon points="26,52 50,52 64,102" fill="url(#gemLeft)" />
  <polygon points="50,52 78,52 64,102" fill="url(#gemCenter)" />
  <polygon points="78,52 102,52 64,102" fill="url(#gemRight)" />
  <!-- Crisp facet highlight -->
  <polygon points="42,28 86,28 102,52 64,102 26,52" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2" stroke-linejoin="round" />
